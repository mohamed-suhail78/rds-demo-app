name: Deploy Spring Boot Docker App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Spring Boot Application
        run: mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t cd-repo .
          docker tag cd-repo:latest 716525550340.dkr.ecr.ap-south-1.amazonaws.com/cd-repo:latest

      - name: Push Docker Image to ECR
        run: |
          docker push 716525550340.dkr.ecr.ap-south-1.amazonaws.com/cd-repo:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Logging in to Amazon ECR..."

            aws ecr get-login-password --region ap-south-1 | \
            docker login --username AWS --password-stdin 716525550340.dkr.ecr.ap-south-1.amazonaws.com

            echo "Pulling latest image..."
            docker pull 716525550340.dkr.ecr.ap-south-1.amazonaws.com/cd-repo:latest

            echo "Stopping old container..."
            docker stop cd-app || true

            echo "Removing old container..."
            docker rm cd-app || true

            echo "Removing old image..."
            docker image prune -af

            echo "Starting new container..."
            docker run -d \
              --name cd-app \
              --restart unless-stopped \
              -p 8080:8080 \
              716525550340.dkr.ecr.ap-south-1.amazonaws.com/cd-repo:latest

            echo "Deployment Completed Successfully!"